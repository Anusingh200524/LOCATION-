<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Directions - Kalindra ITI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #1a73e8;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>📍 Get Directions</h2>

    <p>
        Allow your location to automatically start navigation
        to Kalindra ITI.
    </p>

    <button id="directionBtn">
        Allow Location & Get Directions
    </button>

    <div id="status"></div>

</div>


<script>

document.getElementById("directionBtn").addEventListener("click", getLocation);


function getLocation() {

    const button = document.getElementById("directionBtn");
    const status = document.getElementById("status");

    // Check browser GPS support
    if (!navigator.geolocation) {

        status.innerHTML =
            "❌ Location is not supported by this browser.";

        return;
    }


    // Button loading state
    button.disabled = true;

    button.innerHTML =
        "📍 Getting your location...";

    status.innerHTML =
        "Please allow location access when your browser asks.";


    // Get user's CURRENT GPS location
    navigator.geolocation.getCurrentPosition(

        function(position) {

            // User's current location
            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            status.innerHTML =
                "✅ Location found. Opening Google Maps...";


            /*
             * FIXED DESTINATION
             * Kalindra ITI
             *
             * Latitude:  26.3661438
             * Longitude: 84.3067566
             */

            const destination =
                "26.3661438,84.3067566";


            /*
             * Google Maps Directions URL
             *
             * origin =
             * user's automatic GPS location
             *
             * destination =
             * Kalindra ITI
             */

            const mapsURL =
                "https://www.google.com/maps/dir/?api=1" +
                "&origin=" +
                latitude + "," + longitude +
                "&destination=" +
                destination +
                "&travelmode=driving";


            // Open Google Maps
            window.location.href = mapsURL;

        },


        function(error) {

            button.disabled = false;

            button.innerHTML =
                "Allow Location & Get Directions";


            if (error.code === 1) {

                status.innerHTML =
                    "❌ Location permission denied. " +
                    "Please allow location access.";

            }

            else if (error.code === 2) {

                status.innerHTML =
                    "❌ Unable to determine your location. " +
                    "Please turn on GPS.";

            }

            else if (error.code === 3) {

                status.innerHTML =
                    "❌ Location request timed out. " +
                    "Please try again.";

            }

            else {

                status.innerHTML =
                    "❌ Unable to get your current location.";

            }

        },


        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }

    );

}

</script>

</body>
</html>
